<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>發票管理 V2</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;padding:2rem 1rem}.app{max-width:1120px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.title h1{font-size:25px;font-weight:650}.title p{font-size:13px;color:#666;margin-top:5px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:none;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}.primary{background:#185FA5;color:white}.secondary{background:#ebebea;color:#333}.ghost{background:white;color:#185FA5;border:1px solid #dbe6f1}.small{font-size:12px;padding:7px 10px;border-radius:10px}.card{background:#fff;border:1px solid #e2e2e0;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.04);overflow:hidden}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.metric{background:#ebebea;border-radius:14px;padding:13px 15px}.metric-label{font-size:12px;color:#666;margin-bottom:3px}.metric-value{font-size:22px;font-weight:650}.toolbar{display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;align-items:end;margin-bottom:14px}.field label{display:block;font-size:12px;color:#666;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:10px 11px;font-size:15px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#378ADD;box-shadow:0 0 0 3px rgba(55,138,221,.12)}.field textarea{min-height:78px;resize:vertical}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #ddd;background:#fff;color:#666;border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}.tab.active{background:#185FA5;color:#fff;border-color:#185FA5}.list{display:grid;gap:10px}.po-card{border:1px solid #e2e2e0;border-radius:16px;background:#fff;padding:14px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.po-card.ready{border-left:4px solid #E0A400;background:#fffdf5}.po-card.missing{border-left:4px solid #D85A30;background:#fff8f5}.po-card.ok{border-left:4px solid #1D9E75}.po-card.diff{border-left:4px solid #E0A400}.po-no{font-weight:700;color:#185FA5;font-size:15px}.po-sub{font-size:12px;color:#777;margin-top:4px;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:650}.chip-ready{background:#FFE8A3;color:#8A5A00}.chip-missing{background:#FCEBEB;color:#A32D2D}.chip-ok{background:#EAF3DE;color:#3B6D11}.chip-diff{background:#FFF3D6;color:#9A5B00}.chip-muted{background:#eeeeec;color:#666}.po-side{text-align:right}.amount{font-weight:700;font-size:16px}.muted{color:#888;font-size:12px;margin-top:3px}.row-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:9px;flex-wrap:wrap}.empty{text-align:center;color:#888;padding:44px 18px}.empty i{font-size:38px;display:block;margin-bottom:8px;opacity:.35}.setup{background:#fff8e1;border:1px solid #f1d28b;color:#7b5600;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:14px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(620px,100%);background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.22);overflow:hidden}.modal-head{padding:18px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px}.modal-title{font-weight:700;font-size:18px}.modal-body{padding:18px 20px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#f6f6f4;border-radius:14px;padding:12px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.info-item span{display:block;font-size:11px;color:#888;margin-bottom:2px}.info-item b{font-size:14px}.modal-foot{padding:14px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:9px}.hidden-frame{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#1D9E75;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:none;z-index:60}.toast.show{display:block}@media(max-width:760px){body{padding:1rem}.top{flex-direction:column}.summary{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.po-card{grid-template-columns:1fr}.po-side{text-align:left}.row-actions{justify-content:flex-start}.modal-grid,.info{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><div class="title"><h1><i class="ti ti-receipt" style="font-size:24px;vertical-align:-3px;margin-right:7px"></i>發票管理 V2</h1><p>用 PO 號整合 PO 檔、訂單總表與 Google Sheet 發票資料。直接從待辦清單登打，不必手動輸入 PO。</p></div><div class="actions"><a class="btn ghost" href="採購訂單交貨追蹤_V2_GoogleSheets.html"><i class="ti ti-arrow-left"></i>回主頁</a><button class="btn secondary" onclick="reloadAll()"><i class="ti ti-refresh"></i>重新整理</button></div></div><div id="setupBox" class="setup" style="display:none">請先設定 GOOGLE_APPS_SCRIPT_URL。</div><div class="summary"><div class="metric"><div class="metric-label">PO 總數</div><div class="metric-value" id="mTotal">0</div></div><div class="metric"><div class="metric-label">待開發票</div><div class="metric-value" id="mMissing" style="color:#D85A30">0</div></div><div class="metric"><div class="metric-label">已開發票</div><div class="metric-value" id="mDone" style="color:#1D9E75">0</div></div><div class="metric"><div class="metric-label">發票總額</div><div class="metric-value" id="mAmount" style="font-size:18px">—</div></div></div><div class="card" style="padding:16px"><div class="toolbar"><div class="field"><label>搜尋 PO / 供應商 / 品名 / 發票號碼</label><input id="search" placeholder="例如 PO20260423011、廠商、UU12345678" oninput="renderList()"></div><div class="field"><label>篩選</label><select id="filter" onchange="renderList()"><option value="todo">今天要處理：已交未開票</option><option value="missing">全部未開票</option><option value="ok">金額一致</option><option value="diff">金額不符</option><option value="all">全部 PO</option></select></div><div><button class="btn primary" onclick="openManual()"><i class="ti ti-plus"></i>手動新增</button></div></div><div class="tabs"><button class="tab active" onclick="setFilter('todo',this)">待辦</button><button class="tab" onclick="setFilter('missing',this)">未開票</button><button class="tab" onclick="setFilter('ok',this)">已開票</button><button class="tab" onclick="setFilter('diff',this)">金額不符</button><button class="tab" onclick="setFilter('all',this)">全部</button></div><div id="list" class="list"><div class="empty"><i class="ti ti-loader-2"></i>正在載入...</div></div></div></div><div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target.id==='modalBackdrop')closeModal()"><div class="modal"><div class="modal-head"><div><div class="modal-title" id="modalTitle">登打發票</div><div class="muted" id="modalSubtitle">—</div></div><button class="btn secondary small" onclick="closeModal()"><i class="ti ti-x"></i></button></div><form id="invoiceForm" target="saveFrame" method="POST"><input type="hidden" name="action" value="save"><div class="modal-body"><div class="info"><div class="info-item"><span>PO</span><b id="infoPO">—</b></div><div class="info-item"><span>建議金額</span><b id="infoAmount">—</b></div><div class="info-item"><span>供應商</span><b id="infoSupplier">—</b></div><div class="info-item"><span>交貨狀態</span><b id="infoDelivery">—</b></div></div><div class="modal-grid"><div class="field"><label>PO 號</label><input name="po" id="formPO" required></div><div class="field"><label>發票號碼</label><input name="invoiceNo" id="formInvoiceNo" placeholder="例如 UU12345678" required></div><div class="field"><label>發票金額</label><input name="amount" id="formAmount" inputmode="numeric" required></div><div class="field"><label>發票日期</label><input name="invoiceDate" id="formDate" type="date"></div></div><div class="field" style="margin-top:10px"><label>備註</label><textarea name="note" id="formNote" placeholder="可空白，例如：補開、含稅、部分開票"></textarea></div><div id="formStatus" class="muted" style="margin-top:10px">尚未儲存</div></div><div class="modal-foot"><button class="btn secondary" type="button" onclick="closeModal()">取消</button><button class="btn primary" type="submit"><i class="ti ti-device-floppy"></i>儲存</button></div></form></div></div><iframe name="saveFrame" class="hidden-frame"></iframe><div id="toast" class="toast"></div><script>
const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqSMbvovxMhKISq8Tf6tk9RYw7_kJrBbiQv0i1_uTt5OeB4aHpFuB0lWJO9T3KoEyYFg/exec';
const DEFAULT_MASTER_FILE = './data/master.xlsx';
const DEFAULT_PO_FILE = './data/po.xlsx';
let masterRows=[], poRows=[], invoices=[], combined=[];
function configured(){return GOOGLE_APPS_SCRIPT_URL && GOOGLE_APPS_SCRIPT_URL.startsWith('https://script.google.com/macros/')}
function normalizePO(po){return String(po||'').trim().replace(/\s+/g,'').toUpperCase()}
function money(n){return 'NT$'+Math.round(Number(n||0)).toLocaleString()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
async function fetchArrayBuffer(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.arrayBuffer()}
async function loadMaster(){try{const b=await fetchArrayBuffer(DEFAULT_MASTER_FILE);const wb=XLSX.read(b,{type:'array',cellDates:true});let a=[];['總表','倉庫'].forEach(sheet=>{const ws=wb.Sheets[sheet];if(ws)a=a.concat(parseMaster(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),sheet));});masterRows=a;}catch(e){masterRows=[];}}
async function loadPO(){try{const b=await fetchArrayBuffer(DEFAULT_PO_FILE);const wb=XLSX.read(b,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];poRows=parsePO(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));}catch(e){poRows=[];}}
function findHeaderRow(rows){for(let i=0;i<Math.min(8,rows.length);i++){const row=(rows[i]||[]).map(c=>String(c).trim());if(row.some(c=>c==='PO'||c==='料號名稱'||c==='已交'))return i;}return 1}
function parseMaster(rows,source){const hi=findHeaderRow(rows);const headers=(rows[hi]||[]).map(c=>String(c).replace(/[\n\r]/g,' ').trim());const idx=h=>headers.indexOf(h);const out=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r||r.every(c=>c===''||c==null))continue;const po=String(r[idx('PO')]||'').trim();const delivered=String(r[idx('已交')]||'').trim();const low=delivered.toLowerCase();const name=String(r[idx('料號名稱')]||'').trim();if(!name)continue;if(po.toLowerCase()==='x'||low==='x')continue;const isDelivered=low==='v';const isReturn=delivered.includes('退');out.push({source,po,name,spec:String(r[idx('規格型號')]||'').trim(),qty:Number(r[idx('數量')])||0,unit:String(r[idx('單位')]||'').trim(),unitPrice:Number(r[idx('單價')])||0,total:Number(r[idx('合計')])||0,supplier:String(r[idx('供應商')]||'').trim(),project:String(r[idx('專案')]||'').trim(),delivered,displayStatus:isDelivered?'✓ 已交':isReturn?delivered:(delivered||'未交'),isDelivered,isReturn});}return out}
function parsePO(rows){let hi=0;for(let i=0;i<Math.min(10,rows.length);i++){const cells=(rows[i]||[]).map(c=>String(c).toLowerCase());if(cells.some(c=>c.includes('po')||c.includes('order')||c.includes('採購單')||c.includes('訂單'))){hi=i;break}}const headers=(rows[hi]||[]).map(c=>String(c).replace(/[\n\r]/g,' ').trim().toLowerCase());const findIdx=keys=>{for(const k of keys){const kk=String(k).toLowerCase();let idx=headers.indexOf(kk);if(idx>=0)return idx;idx=headers.findIndex(h=>h.includes(kk));if(idx>=0)return idx}return -1};const poIdx=findIdx(['po','po no','order_no','order no','order','訂單','採購單']);const nameIdx=findIdx(['料號名稱','品名','item','description','product','品項','名稱']);const totalIdx=findIdx(['合計','總價','總金額','amount','total']);const map=new Map();for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r||r.every(c=>c===''||c==null))continue;const po=String((poIdx>=0?r[poIdx]:r[0])||'').trim();if(!po)continue;const key=normalizePO(po);if(!map.has(key))map.set(key,{po,items:0,total:0,names:[]});const o=map.get(key);o.items++;o.total+=Number(String((totalIdx>=0?r[totalIdx]:0)||'').replace(/,/g,''))||0;const name=String((nameIdx>=0?r[nameIdx]:'')||'').trim();if(name&&o.names.length<3)o.names.push(name)}return [...map.values()]}
function loadInvoices() {
  return new Promise(resolve => {

    if (!configured()) {
      invoices = [];
      resolve();
      return;
    }

    const cb =
      'invoiceCb_' +
      Date.now() +
      '_' +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');

    let finished = false;

    const timer = setTimeout(() => {
      if (finished) return;

      finished = true;

      console.warn('Google Sheet 發票載入逾時');

      invoices = [];

      try {
        delete window[cb];
      } catch (e) {}

      if (script.parentNode) {
        script.remove();
      }

      // ★ 就算 Google Sheet 失敗，也一定放行
      resolve();

    }, 8000);


    window[cb] = function(data) {

      if (finished) return;

      finished = true;
      clearTimeout(timer);

      try {

        const rows = Array.isArray(data)
          ? data
          : (
              data &&
              Array.isArray(data.rows)
                ? data.rows
                : []
            );

        invoices = rows.map(x => ({
          createdAt: x.createdAt || '',

          po:
            String(x.po ?? '')
              .trim(),

          invoiceNo:
            String(x.invoiceNo ?? '')
              .trim(),

          amount:
            Number(
              String(x.amount ?? 0)
                .replace(/,/g, '')
            ) || 0,

          invoiceDate:
            x.invoiceDate || '',

          note:
            String(x.note ?? '')
        }));

        console.log(
          'Google Sheet 發票載入成功：',
          invoices.length,
          invoices
        );

      } catch (err) {

        console.error(
          '發票資料處理失敗：',
          err
        );

        invoices = [];
      }

      try {
        delete window[cb];
      } catch (e) {}

      if (script.parentNode) {
        script.remove();
      }

      resolve();
    };


    script.onerror = function(err) {

      if (finished) return;

      finished = true;
      clearTimeout(timer);

      console.error(
        'Google Sheet JSONP 載入失敗：',
        err
      );

      invoices = [];

      try {
        delete window[cb];
      } catch (e) {}

      if (script.parentNode) {
        script.remove();
      }

      // ★ 發票失敗不能拖垮整個系統
      resolve();
    };


    script.src =
      GOOGLE_APPS_SCRIPT_URL +
      '?action=list' +
      '&callback=' +
      encodeURIComponent(cb) +
      '&_=' +
      Date.now();

    document.head.appendChild(script);

  });
}
function combineData(){const poMap=new Map();poRows.forEach(p=>{poMap.set(normalizePO(p.po),{po:p.po,poTotal:p.total||0,poItems:p.items||0,names:p.names||[]})});masterRows.forEach(r=>{const key=normalizePO(r.po);if(!key)return;if(!poMap.has(key))poMap.set(key,{po:r.po,poTotal:0,poItems:0,names:[]});const o=poMap.get(key);if(!o.masterItems)o.masterItems=[];o.masterItems.push(r);});const invMap=new Map();invoices.forEach(x=>{const key=normalizePO(x.po);if(!key)return;if(!invMap.has(key))invMap.set(key,{count:0,amount:0,invoiceNos:[],rows:[]});const m=invMap.get(key);m.count++;m.amount+=Number(String(x.amount||0).replace(/,/g,''))||0;if(x.invoiceNo)m.invoiceNos.push(x.invoiceNo);m.rows.push(x);});combined=[...poMap.values()].map(o=>{const inv=invMap.get(normalizePO(o.po));const masterTotal=(o.masterItems||[]).reduce((s,r)=>s+(r.total||0),0);const total=masterTotal||o.poTotal||0;const hasInvoice=!!inv;const allDelivered=(o.masterItems||[]).length>0 && (o.masterItems||[]).every(r=>r.isDelivered);const diff=(inv?inv.amount:0)-total;const matched=hasInvoice && Math.round(diff)===0;const status=hasInvoice?(matched?'金額一致':'金額不符'):(allDelivered?'已交未開票':'未開發票');return {...o,masterTotal,total,hasInvoice,invoiceAmount:inv?inv.amount:0,invoiceNos:inv?inv.invoiceNos:[],invoiceRows:inv?inv.rows:[],invoiceCount:inv?inv.count:0,allDelivered,diff,isAmountMatched:matched,status};}).sort((a,b)=>rank(a)-rank(b)||String(a.po).localeCompare(String(b.po)));}
function rank(o){if(!o.hasInvoice&&o.allDelivered)return 0;if(!o.hasInvoice)return 1;if(!o.isAmountMatched)return 2;return 3}
function renderSummary(){document.getElementById('mTotal').textContent=combined.length;document.getElementById('mMissing').textContent=combined.filter(x=>!x.hasInvoice).length;document.getElementById('mDone').textContent=combined.filter(x=>x.hasInvoice).length;document.getElementById('mAmount').textContent=money(combined.reduce((s,x)=>s+(x.invoiceAmount||0),0));}
function setFilter(v,btn){document.getElementById('filter').value=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderList()}
function renderList(){renderSummary();const q=document.getElementById('search').value.trim().toLowerCase();const f=document.getElementById('filter').value;let list=combined.filter(o=>{if(f==='todo'&&!(o.allDelivered&&!o.hasInvoice))return false;if(f==='missing'&&o.hasInvoice)return false;if(f==='ok'&&!o.isAmountMatched)return false;if(f==='diff'&&(!o.hasInvoice||o.isAmountMatched))return false;const hay=[o.po,o.status,o.invoiceNos.join(' '),(o.names||[]).join(' '),(o.masterItems||[]).map(x=>x.name+' '+x.supplier).join(' ')].join(' ').toLowerCase();return !q||hay.includes(q)}).slice(0,200);const el=document.getElementById('list');if(!list.length){el.innerHTML='<div class="empty"><i class="ti ti-inbox"></i>沒有符合的 PO</div>';return}el.innerHTML=list.map(cardHtml).join('')}
function cardHtml(o){let cls=o.isAmountMatched?'ok':(!o.hasInvoice?(o.allDelivered?'ready':'missing'):'diff');let chip=o.isAmountMatched?'chip-ok':(!o.hasInvoice?(o.allDelivered?'chip-ready':'chip-missing'):'chip-diff');let items=(o.masterItems||[]).slice(0,4).map(x=>esc(x.name)+' <span class="chip '+(x.isDelivered?'chip-ok':x.isReturn?'chip-missing':'chip-muted')+'">'+esc(x.displayStatus)+'</span>').join('、');if((o.masterItems||[]).length>4)items+='...';const inv=o.hasInvoice?'<div class="muted">發票 '+esc(o.invoiceNos.join('、')||'—')+' ・ '+money(o.invoiceAmount)+'</div>':'<div class="muted">尚未開票</div>';const supplier=esc((o.masterItems&&o.masterItems[0]&&o.masterItems[0].supplier)||'');const countText=o.masterItems&&o.masterItems.length?' ・ 總表 '+o.masterItems.length+' 項':' ・ PO '+(o.poItems||0)+' 項';const safePo=String(o.po).replace(/'/g,"\\'");return '<div class="po-card '+cls+'"><div class="po-main"><div class="po-no">'+esc(o.po)+'</div><div class="po-sub">'+supplier+countText+'</div><div class="chips"><span class="chip '+chip+'">'+esc(o.status)+'</span>'+(o.allDelivered?'<span class="chip chip-ok">總表全數已交</span>':'<span class="chip chip-muted">尚未全交</span>')+'</div><div class="po-sub">'+(items||esc((o.names||[]).join('、')))+'</div></div><div class="po-side"><div class="amount">'+money(o.total)+'</div>'+inv+'<div class="row-actions"><button class="btn primary small" onclick="openInvoice(\''+esc(safePo)+'\')"><i class="ti ti-edit"></i>'+(o.hasInvoice?'修改/補登':'登打發票')+'</button></div></div></div>'}
function openManual(){openInvoice('')}
function openInvoice(po){const o=combined.find(x=>normalizePO(x.po)===normalizePO(po))||{po:po,total:0,masterItems:[],invoiceRows:[],invoiceNos:[]};document.getElementById('modalTitle').textContent=o.hasInvoice?'修改/補登發票':'登打發票';document.getElementById('modalSubtitle').textContent=o.po||'手動新增';document.getElementById('infoPO').textContent=o.po||'—';document.getElementById('infoAmount').textContent=money(o.total||0);document.getElementById('infoSupplier').textContent=(o.masterItems&&o.masterItems[0]&&o.masterItems[0].supplier)||'—';document.getElementById('infoDelivery').textContent=o.allDelivered?'總表全數已交':'尚未全交或無總表資料';document.getElementById('formPO').value=o.po||'';document.getElementById('formInvoiceNo').value=(o.invoiceNos&&o.invoiceNos[0])||'';document.getElementById('formAmount').value=Math.round((o.invoiceAmount||o.total||0));document.getElementById('formDate').value=today();document.getElementById('formNote').value='';document.getElementById('formStatus').textContent='尚未儲存';document.getElementById('modalBackdrop').classList.add('show');setTimeout(()=>document.getElementById('formInvoiceNo').focus(),50)}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('invoiceForm').addEventListener('submit', e => {
  e.preventDefault();

  if (!configured()) {
    document.getElementById('formStatus').textContent = '請先設定 GOOGLE_APPS_SCRIPT_URL';
    return;
  }

  const fd = new FormData(e.currentTarget);
  const cb = 'saveCb_' + Date.now();

  window[cb] = async res => {
    delete window[cb];

    if (!res || !res.ok) {
      document.getElementById('formStatus').textContent = '儲存失敗';
      return;
    }

    toast('已儲存');
    closeModal();
    await loadInvoices();
    combineData();
    renderList();
  };

  const params = new URLSearchParams(fd);
  params.set('callback', cb);

  const s = document.createElement('script');
  s.src = GOOGLE_APPS_SCRIPT_URL + '?' + params.toString();
  document.body.appendChild(s);

  document.getElementById('formStatus').textContent = '正在儲存...';
  setTimeout(() => s.remove(), 6000);
});
async function reloadAll() {

  const listEl =
    document.getElementById('list');

  listEl.innerHTML =
    '<div class="empty">' +
      '<i class="ti ti-loader-2"></i>' +
      '正在載入 PO 與訂單總表...' +
    '</div>';

  try {

    // =====================================
    // 第一階段
    // 先載入 Excel
    // 不等 Google Sheet
    // =====================================

    await Promise.all([
      loadMaster(),
      loadPO()
    ]);

    console.log(
      'PO 載入：',
      poRows.length
    );

    console.log(
      '總表載入：',
      masterRows.length
    );


    // 先用沒有發票的狀態畫一次
    invoices = [];

    combineData();
    renderList();


    // =====================================
    // 第二階段
    // 再背景抓 Google Sheet
    // =====================================

    try {

      await loadInvoices();

      console.log(
        '發票載入：',
        invoices.length
      );

      combineData();
      renderList();

    } catch (invoiceErr) {

      console.error(
        '發票同步失敗，但 PO 畫面繼續使用：',
        invoiceErr
      );

    }

  } catch (err) {

    console.error(
      'Excel 載入失敗：',
      err
    );

    listEl.innerHTML =
      '<div class="empty">' +
        '<i class="ti ti-alert-circle"></i>' +
        'PO 或訂單總表載入失敗' +
      '</div>';

  }

}
reloadAll();
