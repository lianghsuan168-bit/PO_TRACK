<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>採購訂單交貨追蹤</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;padding:2rem 1rem;}
.app{max-width:860px;margin:0 auto;}
.header{margin-bottom:1.25rem;}
.header h1{font-size:22px;font-weight:500;color:#1a1a1a;}
.header p{font-size:13px;color:#666;margin-top:3px;}
 
.upload-area{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem;}
.upload-box{border:1px solid #ddd;border-radius:12px;padding:.875rem 1.1rem;background:#fff;cursor:pointer;transition:border-color .15s;position:relative;overflow:hidden;}
.upload-box:hover{border-color:#aaa;}
.upload-box.loaded{border-color:#1D9E75;}
.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;}
.upload-label{font-size:13px;font-weight:500;color:#1a1a1a;display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.upload-label i{font-size:17px;color:#378ADD;}
.upload-hint{font-size:12px;color:#888;}
.upload-status{font-size:12px;color:#1D9E75;margin-top:5px;display:none;}
.upload-status.show{display:block;}
 
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:1.25rem;}
.metric{background:#ebebea;border-radius:8px;padding:.7rem .9rem;}
.metric-label{font-size:11px;color:#666;margin-bottom:2px;}
.metric-value{font-size:19px;font-weight:500;color:#1a1a1a;}
 
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #e0e0e0;margin-bottom:1.1rem;}
.tab-btn{padding:7px 18px;font-size:14px;font-weight:400;color:#888;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.tab-btn.active{color:#1a1a1a;border-bottom-color:#378ADD;font-weight:500;}
.tab-btn:hover:not(.active){color:#1a1a1a;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:9px;font-size:11px;font-weight:500;padding:0 5px;margin-left:5px;}
.bp{background:#FAEEDA;color:#854F0B;}
.bd{background:#EAF3DE;color:#3B6D11;}
 
.po-list{display:flex;flex-direction:column;gap:7px;}
.po-card{border:1px solid #e0e0e0;border-radius:12px;background:#fff;overflow:hidden;transition:border-color .15s;}
.po-card:hover{border-color:#bbb;}
.po-header{display:flex;align-items:center;gap:10px;padding:.9rem 1.1rem;cursor:pointer;}
.po-title{flex:1;}
.po-no{font-size:14px;font-weight:500;color:#185FA5;}
.po-sub{font-size:12px;color:#888;margin-top:2px;}
.po-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.po-amount{font-size:13px;font-weight:500;color:#1a1a1a;}
.po-amount-sub{font-size:11px;color:#888;}
 
.prog-area{padding:0 1.1rem .75rem;}
.prog-labels{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px;}
.prog-pct{font-weight:500;}
.prog-track{height:5px;background:#ebebea;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.fill-low{background:#E24B4A;}
.fill-mid{background:#EF9F27;}
.fill-high{background:#639922;}
.fill-done{background:#1D9E75;}
 
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:500;}
.chip-pending{background:#FAEEDA;color:#854F0B;}
.chip-done{background:#EAF3DE;color:#3B6D11;}
.chip-partial{background:#FAECE7;color:#993C1D;}
.chip-return{background:#FCEBEB;color:#A32D2D;}
 
.chevron{font-size:15px;color:#888;transition:transform .2s;flex-shrink:0;}
.chevron.open{transform:rotate(180deg);}
 
.detail{display:none;border-top:1px solid #e8e8e8;}
.detail.open{display:block;}
.detail-inner{padding:.75rem 1.1rem;}
.dtitle{font-size:11px;font-weight:500;color:#888;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
 
.dtbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.dtbl th{text-align:left;padding:5px 8px;font-weight:500;font-size:11px;color:#888;border-bottom:1px solid #eee;white-space:nowrap;}
.dtbl td{padding:6px 8px;border-bottom:1px solid #eee;color:#1a1a1a;vertical-align:middle;}
.dtbl tr:last-child td{border-bottom:none;}
.dtbl tr:hover td{background:#fafafa;}
.num{text-align:right;}
.c-red{color:#D85A30;font-weight:500;}
.c-green{color:#1D9E75;}
.c-muted{color:#888;}
 
.summary-row{background:#f5f5f3;margin-top:6px;padding:7px 10px;border-radius:8px;display:flex;gap:20px;font-size:12px;flex-wrap:wrap;}
.sr-item{display:flex;gap:5px;align-items:center;}
.sr-label{color:#888;}
.sr-value{font-weight:500;color:#1a1a1a;}
 
.empty-state{text-align:center;padding:3rem 1rem;color:#888;font-size:14px;}
.empty-state i{font-size:38px;display:block;margin-bottom:10px;opacity:.3;}
.sample-btn{font-size:12px;color:#185FA5;background:none;border:1px solid #B5D4F4;border-radius:8px;padding:4px 12px;cursor:pointer;margin-top:8px;}
.sample-btn:hover{background:#E6F1FB;}
 
.done-card{border-left:3px solid #1D9E75;}
.urgent-card{border-left:4px solid #D85A30;background:#FFF7F4;}
.chip-urgent{background:#FCEBEB;color:#C62828;font-weight:600;}
.bu{background:#FCEBEB;color:#A32D2D;}
.invoice-missing-card{border-left:4px solid #D85A30;background:#FFF7F4;}
.invoice-ok-card{border-left:4px solid #1D9E75;}
.chip-invoice-missing{background:#FCEBEB;color:#A32D2D;font-weight:600;}
.chip-invoice-ok{background:#EAF3DE;color:#3B6D11;font-weight:600;}
.chip-invoice-diff{background:#FFF3D6;color:#9A5B00;font-weight:600;}
.c-warn{color:#9A5B00;font-weight:500;}
 
@media(max-width:600px){
  .upload-area{grid-template-columns:1fr;}
  .summary-bar{grid-template-columns:1fr 1fr;}
  .po-right{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1><i class="ti ti-clipboard-list" aria-hidden="true" style="font-size:20px;vertical-align:-2px;margin-right:7px;"></i>採購訂單交貨追蹤</h1>
    <p>預設從 data/訂單總表.xlsx 載入；需要更新時再上傳新檔</p>
  </div>
 
  <div class="upload-area">
    <div class="upload-box" id="box-master">
      <input type="file" accept=".xlsx,.xls,.csv" id="file-master" onchange="handleMaster(this)">
      <div class="upload-label"><i class="ti ti-table" aria-hidden="true"></i>訂單總表</div>
      <div class="upload-hint">預設讀取 data/訂單總表.xlsx；更新時可上傳新版 Excel 覆蓋</div>
      <div class="upload-status" id="status-master"><i class="ti ti-check" aria-hidden="true"></i> <span id="fname-master"></span></div>
    </div>
    <div class="upload-box" id="box-po">
      <input type="file" accept=".xlsx,.xls,.csv" id="file-po" onchange="handlePO(this)">
      <div class="upload-label"><i class="ti ti-file-invoice" aria-hidden="true"></i>PO 採購單</div>
      <div class="upload-hint">客戶下的採購訂單 Excel 或 CSV</div>
      <div class="upload-status" id="status-po"><i class="ti ti-check" aria-hidden="true"></i> <span id="fname-po"></span></div>
    </div>
    <div class="upload-box" id="box-invoice">
      <input type="file" accept=".xlsx,.xls,.csv" id="file-invoice" onchange="handleInvoice(this)">
      <div class="upload-label"><i class="ti ti-receipt" aria-hidden="true"></i>發票檔</div>
      <div class="upload-hint">上傳發票 Excel，與 PO 檔比對是否已開發票</div>
      <div class="upload-status" id="status-invoice"><i class="ti ti-check" aria-hidden="true"></i> <span id="fname-invoice"></span></div>
    </div>
  </div>
 
  <div id="summary-bar" class="summary-bar" style="display:none;">
    <div class="metric"><div class="metric-label">PO 總數</div><div class="metric-value" id="m-total">0</div></div>
    <div class="metric"><div class="metric-label">未完成</div><div class="metric-value" style="color:#D85A30;" id="m-pending">0</div></div>
    <div class="metric"><div class="metric-label">已完成</div><div class="metric-value" style="color:#1D9E75;" id="m-done">0</div></div>
    <div class="metric"><div class="metric-label">總金額</div><div class="metric-value" style="font-size:15px;" id="m-amount">—</div></div>
  </div>
 
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('urgent',this)">🚨 急件 <span class="badge bu" id="badge-urgent">0</span></button>
    <button class="tab-btn" onclick="switchTab('main-pending',this)">總表未完成 <span class="badge bp" id="badge-main-p">0</span></button>
    <button class="tab-btn" onclick="switchTab('main-done',this)">總表已完成 <span class="badge bd" id="badge-main-d">0</span></button>
    <button class="tab-btn" onclick="switchTab('wh-pending',this)">倉庫未完成 <span class="badge bp" id="badge-wh-p">0</span></button>
    <button class="tab-btn" onclick="switchTab('wh-done',this)">倉庫已完成 <span class="badge bd" id="badge-wh-d">0</span></button>
    <button class="tab-btn" onclick="switchTab('missing-po',this)">未收到 PO <span class="badge bp" id="badge-missing-po">0</span></button>
    <button class="tab-btn" onclick="switchTab('invoice-match',this)">發票匹配 <span class="badge bu" id="badge-invoice-missing">0</span></button>
  </div>
 
  <div id="tab-urgent">
    <div class="po-list" id="list-urgent">
      <div class="empty-state"><i class="ti ti-alert-triangle" aria-hidden="true"></i>尚無急件</div>
    </div>
  </div>
  <div id="tab-main-pending" style="display:none;">
    <div class="po-list" id="list-main-pending">
      <div class="empty-state">
        <i class="ti ti-inbox" aria-hidden="true"></i>
        正在載入 data/訂單總表.xlsx...
      </div>
    </div>
  </div>
  <div id="tab-main-done" style="display:none;">
    <div class="po-list" id="list-main-done">
      <div class="empty-state"><i class="ti ti-check-square" aria-hidden="true"></i>尚無總表已完成訂單</div>
    </div>
  </div>
  <div id="tab-wh-pending" style="display:none;">
    <div class="po-list" id="list-wh-pending">
      <div class="empty-state"><i class="ti ti-building-warehouse" aria-hidden="true"></i>尚無倉庫未完成訂單</div>
    </div>
  </div>
  <div id="tab-wh-done" style="display:none;">
    <div class="po-list" id="list-wh-done">
      <div class="empty-state"><i class="ti ti-check-square" aria-hidden="true"></i>尚無倉庫已完成訂單</div>
    </div>
  </div>
  <div id="tab-missing-po" style="display:none;">
    <div class="po-list" id="list-missing-po">
      <div class="empty-state"><i class="ti ti-file-alert" aria-hidden="true"></i>尚無未收到 PO 的項目</div>
    </div>
  </div>
  <div id="tab-invoice-match" style="display:none;">
    <div class="po-list" id="list-invoice-match">
      <div class="empty-state"><i class="ti ti-receipt" aria-hidden="true"></i>請先上傳 PO 檔與發票檔進行匹配</div>
    </div>
  </div>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let masterMainData = [];
let warehouseData = [];
let poData = null;
let invoiceData = null;
let allOrders = [];
let dashboardSummary = {total: 0, pending: 0, done: 0, amount: 0};
let invoiceSummary = {poCount: 0, invoicedCount: 0, missingCount: 0, poTotal: 0, invoiceTotal: 0, missingAmount: 0, diffTotal: 0};
let currentTab = 'urgent';
const DEFAULT_MASTER_FILE = './data/訂單總表.xlsx';

function loadMasterWorkbook(arrayBuffer, fileName, isDefault=false) {
  const wb = XLSX.read(arrayBuffer, {type:'array', cellDates:true});

  const wsMain = wb.Sheets['總表'];
  const wsWarehouse = wb.Sheets['倉庫'];

  masterMainData = wsMain
    ? parseMaster(XLSX.utils.sheet_to_json(wsMain, {header:1, defval:''}))
    : [];

  warehouseData = wsWarehouse
    ? parseMaster(XLSX.utils.sheet_to_json(wsWarehouse, {header:1, defval:''}))
    : [];

  document.getElementById('fname-master').textContent = isDefault ? `${fileName} 已載入` : fileName;
  document.getElementById('status-master').classList.add('show');
  document.getElementById('box-master').classList.add('loaded');

  processDataBySource();
}

async function loadDefaultMaster() {
  try {
    const response = await fetch(DEFAULT_MASTER_FILE, {cache: 'no-store'});

    if(!response.ok) {
      throw new Error(`找不到預設檔案：${DEFAULT_MASTER_FILE}`);
    }

    const buffer = await response.arrayBuffer();
    loadMasterWorkbook(buffer, DEFAULT_MASTER_FILE, true);
  } catch(err) {
    console.error('預設訂單總表載入失敗', err);
    document.getElementById('list-main-pending').innerHTML =
      '<div class="empty-state"><i class="ti ti-alert-circle" aria-hidden="true"></i>找不到 data/訂單總表.xlsx，請確認 GitHub 上有放這個檔案，或手動上傳 Excel</div>';
  }
}

function handleMaster(input) {
  const f = input.files[0]; if(!f) return;

  const r = new FileReader();
  r.onload = e => {
    try {
      loadMasterWorkbook(e.target.result, f.name, false);
    } catch(err) {
      console.error('訂單總表讀取失敗', err);
      alert('訂單總表讀取失敗，請確認檔案格式是否正確。');
    }
  };

  r.readAsArrayBuffer(f);
}
 
function handlePO(input) {
  const f = input.files[0]; if(!f) return;
  document.getElementById('fname-po').textContent = f.name;
  document.getElementById('status-po').classList.add('show');
  document.getElementById('box-po').classList.add('loaded');
  const r = new FileReader();
  r.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      poData = parsePO(rows);
      tryProcess();
    } catch(err){ console.error(err); }
  };
  r.readAsArrayBuffer(f);
}
 

function handleInvoice(input) {
  const f = input.files[0]; if(!f) return;
  document.getElementById('fname-invoice').textContent = f.name;
  document.getElementById('status-invoice').classList.add('show');
  document.getElementById('box-invoice').classList.add('loaded');

  const r = new FileReader();
  r.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      invoiceData = parseInvoice(rows);
      tryProcess();
    } catch(err) {
      console.error('發票檔讀取失敗', err);
      alert('發票檔讀取失敗，請確認檔案格式是否正確。');
    }
  };
  r.readAsArrayBuffer(f);
}

function findHeaderRow(rows) {
  for(let i = 0; i < Math.min(5, rows.length); i++) {
    const row = rows[i].map(c => String(c).trim());
    if(row.some(c => c === '序號' || c === 'PO' || c === '料號名稱')) return i;
  }
  return 1;
}
 
function parseMaster(rows) {
  const hi = findHeaderRow(rows);
  const headers = rows[hi].map(c => String(c).replace(/[\n\r]/g,' ').trim());
  const idx = h => headers.indexOf(h);
  const data = [];
  for(let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    if(!r || r.every(c => c === '' || c === null || c === undefined)) continue;
    const po        = String(r[idx('PO')] || '').trim();
    const poLower   = po.toLowerCase();
    const name      = String(r[idx('料號名稱')] || '').trim();
    if(!name) continue;

    const delivered = String(r[idx('已交')] || '').trim();
    const statusLower = delivered.toLowerCase();

    // PO 欄或已交欄為 x / X 時，代表此品項不列入顯示與統計
    if(poLower === 'x' || statusLower === 'x') continue;

    const qty       = parseFloat(r[idx('數量')]) || 0;
    const unitPrice = parseFloat(r[idx('單價')]) || 0;
    const total     = parseFloat(r[idx('合計')]) || 0;
    const spec      = String(r[idx('規格型號')] || '').trim();
    const unit      = String(r[idx('單位')] || '').trim();
    const project   = String(r[idx('專案')] || '').trim();
    const usage     = String(r[idx('用途')] || '').trim();
    const supplier  = String(r[idx('供應商')] || '').trim();
    const remark    = String(r[idx('備註')] || '').trim();
    const isDelivered = statusLower === 'v';
    const isReturn    = delivered.includes('退');
    const isUrgent    = delivered.includes('急') || statusLower.includes('urgent');
    const displayStatus = isDelivered ? '✓ 已交' : isReturn ? delivered : (delivered || '未交');
    data.push({po, name, spec, unit, qty, unitPrice, total, project, usage, supplier, remark, delivered, displayStatus, isDelivered, isReturn, isUrgent});
  }
  return data;
}
 
function parsePO(rows) {
  // 支援多種 PO 檔欄位名稱：
  // 例如 PO / PO NO / order_no / order no / 訂單 / 採購單
  // 品名可為 料號名稱 / 品名 / item / description
  let hi = 0;

  const headerLooksLikePO = row => {
    const cells = (row || []).map(c => String(c).replace(/[\n\r]/g,' ').trim().toLowerCase());
    const hasPO = cells.some(c =>
      c === 'po' ||
      c === 'po no' ||
      c === 'po no.' ||
      c.includes('po號') ||
      c.includes('po no') ||
      c.includes('order_no') ||
      c.includes('order no') ||
      c.includes('order') ||
      c.includes('訂單') ||
      c.includes('採購單')
    );
    const hasItem = cells.some(c =>
      c.includes('料號名稱') ||
      c.includes('品名') ||
      c === 'item' ||
      c.includes('description') ||
      c.includes('product') ||
      c.includes('品項') ||
      c.includes('名稱')
    );
    return hasPO || hasItem;
  };

  for(let i = 0; i < Math.min(10, rows.length); i++) {
    if(headerLooksLikePO(rows[i])) {
      hi = i;
      break;
    }
  }

  const headers = (rows[hi] || []).map(c => String(c).replace(/[\n\r]/g,' ').trim().toLowerCase());

  const findIdx = keys => {
    for(const key of keys) {
      const k = String(key).toLowerCase();
      const exact = headers.indexOf(k);
      if(exact >= 0) return exact;
      const partial = headers.findIndex(h => h.includes(k));
      if(partial >= 0) return partial;
    }
    return -1;
  };

  const poIdx = findIdx([
    'po', 'po no', 'po no.', 'po號', 'po號碼',
    'order_no', 'order no', 'order', '訂單', '採購單'
  ]);
  const nameIdx = findIdx([
    '料號名稱', '品名', 'item', 'description', 'product', '品項', '名稱'
  ]);
  const qtyIdx = findIdx(['數量', 'qty', 'quantity']);
  const unitIdx = findIdx(['單位', 'unit']);
  const unitPriceIdx = findIdx(['單價', 'unit price', 'price']);
  const totalIdx = findIdx(['合計', '總價', '總金額', 'amount', 'total']);

  const data = [];
  const start = hi + 1;

  for(let i = start; i < rows.length; i++) {
    const r = rows[i];
    if(!r || r.every(c => c === '' || c === null || c === undefined)) continue;

    const po = String((poIdx >= 0 ? r[poIdx] : r[0]) || '').trim();
    if(!po) continue;

    // 若沒有品名欄，仍保留 PO，否則發票匹配會沒有資料
    const name = String((nameIdx >= 0 ? r[nameIdx] : '') || '').trim();
    const qty = parseFloat(String((qtyIdx >= 0 ? r[qtyIdx] : '') || '').replace(/,/g, '')) || 0;
    const unit = String((unitIdx >= 0 ? r[unitIdx] : '') || '').trim();
    const unitPrice = parseFloat(String((unitPriceIdx >= 0 ? r[unitPriceIdx] : '') || '').replace(/,/g, '')) || 0;
    const total = parseFloat(String((totalIdx >= 0 ? r[totalIdx] : '') || '').replace(/,/g, '')) || 0;

    data.push({po, name, qty, unit, unitPrice, total});
  }

  return data;
}
 

function parseInvoice(rows) {
  let hi = 0;
  for(let i = 0; i < Math.min(10, rows.length); i++) {
    const row = (rows[i] || []).map(c => String(c).trim().toLowerCase());
    if(row.some(c => c === 'po' || c.includes('po') || c.includes('採購單') || c.includes('訂單'))) {
      hi = i;
      break;
    }
  }

  const headers = (rows[hi] || []).map(c => String(c).replace(/[\n\r]/g,' ').trim().toLowerCase());
  const findIdx = keys => {
    for(const key of keys) {
      const exact = headers.indexOf(String(key).toLowerCase());
      if(exact >= 0) return exact;
      const partial = headers.findIndex(h => h.includes(String(key).toLowerCase()));
      if(partial >= 0) return partial;
    }
    return -1;
  };

  const poIdx = findIdx(['po', '採購單', '訂單']);
  const amountIdx = findIdx(['price', 'amount', '金額', '發票金額', '未稅', '含稅', '合計']);
  const invoiceNoIdx = findIdx(['invoice', '發票', '發票號碼', '號碼']);

  const data = [];
  const start = (poIdx >= 0) ? hi + 1 : 0;

  for(let i = start; i < rows.length; i++) {
    const r = rows[i];
    if(!r || r.every(c => c === '' || c === null || c === undefined)) continue;

    const po = String((poIdx >= 0 ? r[poIdx] : r[0]) || '').trim();
    if(!po) continue;

    const amountRaw = amountIdx >= 0 ? r[amountIdx] : r[1];
    const amount = parseFloat(String(amountRaw || '').replace(/,/g, '')) || 0;
    const invoiceNo = invoiceNoIdx >= 0 ? String(r[invoiceNoIdx] || '').trim() : '';

    data.push({po, amount, invoiceNo});
  }

  return data;
}

function normalizePO(po) {
  return String(po || '').trim().replace(/\s+/g, '').toUpperCase();
}

function getReceivedPOSet() {
  const set = new Set();
  (poData || []).forEach(row => {
    const po = normalizePO(row.po);
    if(po) set.add(po);
  });
  return set;
}

function buildOrders(data, sourceLabel) {
  const orders = {};
  data.forEach(row => {
    const key = row.po || '(無PO)';
    if(!orders[key]) {
      orders[key] = {po: key, source: sourceLabel, project: row.project, supplier: row.supplier, items: []};
    }
    orders[key].items.push(row);
  });

  return Object.values(orders).map(o => {
    const items          = o.items;
    const total          = items.reduce((s, i) => s + (i.total || 0), 0);
    const deliveredTotal = items.filter(i => i.isDelivered).reduce((s, i) => s + (i.total || 0), 0);
    const deliveredCount = items.filter(i => i.isDelivered).length;
    const returnCount    = items.filter(i => i.isReturn).length;
    const pendingItems   = items.filter(i => !i.isDelivered && !i.isReturn);
    const pendingCount   = pendingItems.length;
    const totalCount     = items.length;
    const pct            = totalCount > 0 ? Math.round((deliveredCount / totalCount) * 100) : 0;
    const isDone         = pendingCount === 0 && returnCount === 0;
    const urgentCount    = items.filter(i => i.isUrgent).length;
    const latestStatuses = [...new Set(pendingItems.map(i => i.displayStatus || i.delivered || '未交'))];
    return {...o, total, deliveredTotal, deliveredCount, returnCount, pendingCount, totalCount, pct, isDone, latestStatuses, urgentCount, isUrgent: urgentCount > 0};
  });
}

function isMissingPOOrder(order, receivedPOSet) {
  const po = normalizePO(order.po);
  if(!po || order.po === '(無PO)') return true;
  // 有上傳 PO 採購單時，總表/倉庫內沒有對應 PO 的訂單歸到「未收到 PO」
  if(receivedPOSet.size > 0 && !receivedPOSet.has(po)) return true;
  return false;
}


function getInvoiceMap() {
  const map = new Map();
  (invoiceData || []).forEach(row => {
    const po = normalizePO(row.po);
    if(!po) return;
    if(!map.has(po)) {
      map.set(po, {po: row.po, count: 0, amount: 0, invoiceNos: []});
    }
    const info = map.get(po);
    info.count += 1;
    info.amount += row.amount || 0;
    if(row.invoiceNo) info.invoiceNos.push(row.invoiceNo);
  });
  return map;
}

function buildPOInvoiceMatches() {
  const invoiceMap = getInvoiceMap();
  const poMap = new Map();

  (poData || []).forEach(row => {
    const key = normalizePO(row.po);
    if(!key) return;
    if(!poMap.has(key)) {
      poMap.set(key, {po: row.po, items: [], poTotal: 0});
    }
    const item = poMap.get(key);
    item.items.push(row);
    item.poTotal += row.total || 0;
  });

  return [...poMap.entries()].map(([key, poInfo]) => {
    const inv = invoiceMap.get(key);
    const invoiceAmount = inv ? inv.amount : 0;
    const diff = invoiceAmount - poInfo.poTotal;
    const isAmountMatched = !!inv && Math.round(diff) === 0;
    const status = !inv ? '未開發票' : isAmountMatched ? '金額一致' : '金額不符';
    return {
      poKey: key,
      po: poInfo.po,
      items: poInfo.items,
      poTotal: poInfo.poTotal,
      hasInvoice: !!inv,
      invoiceCount: inv ? inv.count : 0,
      invoiceAmount,
      diff,
      isAmountMatched,
      status,
      invoiceNos: inv ? inv.invoiceNos : []
    };
  }).sort((a, b) => {
    if(a.hasInvoice !== b.hasInvoice) return a.hasInvoice ? 1 : -1;
    return String(a.po).localeCompare(String(b.po));
  });
}



function buildInvoiceSummary(list) {
  const poTotal = (list || []).reduce((s, x) => s + (x.poTotal || 0), 0);
  const invoiceTotal = (list || []).reduce((s, x) => s + (x.invoiceAmount || 0), 0);
  const missingAmount = (list || []).filter(x => !x.hasInvoice).reduce((s, x) => s + (x.poTotal || 0), 0);
  const missingCount = (list || []).filter(x => !x.hasInvoice).length;
  const invoicedCount = (list || []).length - missingCount;
  return {
    poCount: (list || []).length,
    invoicedCount,
    missingCount,
    poTotal,
    invoiceTotal,
    missingAmount,
    diffTotal: invoiceTotal - poTotal
  };
}

function processDataBySource() {
  const receivedPOSet = getReceivedPOSet();
  const mainOrdersAll      = buildOrders(masterMainData, '總表');
  const warehouseOrdersAll = buildOrders(warehouseData, '倉庫');

  const allSourceOrders = [...mainOrdersAll, ...warehouseOrdersAll];

  const urgentOrders = allSourceOrders
    .filter(o => o.isUrgent)
    .sort((a, b) => a.source.localeCompare(b.source) || a.po.localeCompare(b.po));

  const missingPOOrders = allSourceOrders
    .filter(o => isMissingPOOrder(o, receivedPOSet))
    .sort((a, b) => a.source.localeCompare(b.source) || a.po.localeCompare(b.po));

  const mainOrders      = mainOrdersAll.filter(o => !isMissingPOOrder(o, receivedPOSet));
  const warehouseOrders = warehouseOrdersAll.filter(o => !isMissingPOOrder(o, receivedPOSet));

  const mainPending = mainOrders.filter(o => !o.isDone).sort((a, b) => a.pct - b.pct);
  const mainDone    = mainOrders.filter(o => o.isDone).sort((a, b) => a.po.localeCompare(b.po));
  const whPending   = warehouseOrders.filter(o => !o.isDone).sort((a, b) => a.pct - b.pct);
  const whDone      = warehouseOrders.filter(o => o.isDone).sort((a, b) => a.po.localeCompare(b.po));

  allOrders = [...mainOrders, ...warehouseOrders, ...missingPOOrders];
  const grandTotal = allOrders.reduce((s, o) => s + o.total, 0);

  dashboardSummary = {
    total: allOrders.length,
    pending: mainPending.length + whPending.length + missingPOOrders.filter(o => !o.isDone).length,
    done: mainDone.length + whDone.length + missingPOOrders.filter(o => o.isDone).length,
    amount: grandTotal
  };

  document.getElementById('badge-urgent').textContent   = urgentOrders.length;
  document.getElementById('badge-main-p').textContent   = mainPending.length;
  document.getElementById('badge-main-d').textContent   = mainDone.length;
  document.getElementById('badge-wh-p').textContent     = whPending.length;
  document.getElementById('badge-wh-d').textContent     = whDone.length;
  document.getElementById('badge-missing-po').textContent = missingPOOrders.length;

  const invoiceMatches = buildPOInvoiceMatches();
  const invoiceMissingCount = invoiceMatches.filter(x => !x.hasInvoice).length;
  invoiceSummary = buildInvoiceSummary(invoiceMatches);
  document.getElementById('badge-invoice-missing').textContent = invoiceMissingCount;

  document.getElementById('summary-bar').style.display = 'grid';
  updateSummaryForTab(currentTab);

  renderUrgent(urgentOrders, 'list-urgent', 'ug');
  renderPending(mainPending, 'list-main-pending', 'mp');
  renderDone(mainDone, 'list-main-done', 'md');
  renderPending(whPending, 'list-wh-pending', 'wp');
  renderDone(whDone, 'list-wh-done', 'wd');
  renderMissingPO(missingPOOrders, 'list-missing-po', 'np');
  renderInvoiceMatch(invoiceMatches, 'list-invoice-match', 'iv');
}

function itemSortRank(item) {
  if(item.isUrgent) return 0;
  if(!item.isDelivered && !item.isReturn) return 1;
  if(item.isReturn) return 2;
  if(item.isDelivered) return 3;
  return 4;
}

function sortedItems(items) {
  return [...(items || [])].sort((a, b) => {
    const ra = itemSortRank(a);
    const rb = itemSortRank(b);
    if(ra !== rb) return ra - rb;
    return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant');
  });
}

function fillClass(p) {
  return p < 30 ? 'fill-low' : p < 70 ? 'fill-mid' : p < 100 ? 'fill-high' : 'fill-done';
}

                  <td>${item.name}</td>
                  <td class="c-muted" style="font-size:11px;">${item.spec}</td>
                  <td class="num">${item.qty}</td>
                  <td class="num c-muted">${item.unit}</td>
                  <td class="num">${item.unitPrice > 0 ? item.unitPrice.toLocaleString() : '—'}</td>
                  <td class="num ${amtCls}">${item.total > 0 ? 'NT$' + item.total.toLocaleString() : '—'}</td>
                  <td style="text-align:center;"><span class="chip ${chipClass}">${chipLabel}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');
}


function renderInvoiceMatch(list, targetId, prefix) {
  const el = document.getElementById(targetId);

  if(!poData || !poData.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-file-invoice" aria-hidden="true"></i>請先上傳 PO 檔，才能與發票檔匹配</div>';
    return;
  }

  if(!invoiceData || !invoiceData.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-receipt" aria-hidden="true"></i>請上傳發票檔，未開發票的 PO 會在這裡標紅</div>';
    return;
  }

  if(!list.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-circle-check" aria-hidden="true"></i>沒有可匹配的 PO</div>';
    return;
  }

  const missingCount = list.filter(x => !x.hasInvoice).length;
  const invoicedCount = list.length - missingCount;
  const diffCount = list.filter(x => x.hasInvoice && !x.isAmountMatched).length;
  const matchedCount = list.filter(x => x.hasInvoice && x.isAmountMatched).length;
  const totalPOAmount = list.reduce((s, x) => s + (x.poTotal || 0), 0);
  const totalInvoiceAmount = list.reduce((s, x) => s + (x.invoiceAmount || 0), 0);
  const totalMissingAmount = list.filter(x => !x.hasInvoice).reduce((s, x) => s + (x.poTotal || 0), 0);
  const totalDiffAmount = totalInvoiceAmount - totalPOAmount;

  el.innerHTML = `
    <div class="summary-row" style="margin-bottom:10px;">
      <div class="sr-item"><span class="sr-label">PO 總數</span><span class="sr-value">${list.length}</span></div>
      <div class="sr-item"><span class="sr-label">金額一致</span><span class="sr-value c-green">${matchedCount}</span></div>
      <div class="sr-item"><span class="sr-label">金額不符</span><span class="sr-value c-warn">${diffCount}</span></div>
      <div class="sr-item"><span class="sr-label">未開發票</span><span class="sr-value" style="color:#D85A30;">${missingCount}</span></div>
      <div class="sr-item"><span class="sr-label">PO總額</span><span class="sr-value">${moneyText(totalPOAmount)}</span></div>
      <div class="sr-item"><span class="sr-label">發票總額</span><span class="sr-value c-green">${moneyText(totalInvoiceAmount)}</span></div>
      <div class="sr-item"><span class="sr-label">未開發票金額</span><span class="sr-value c-red">${moneyText(totalMissingAmount)}</span></div>
      <div class="sr-item"><span class="sr-label">差額總計</span><span class="sr-value ${totalDiffAmount === 0 ? 'c-green' : 'c-warn'}">${moneyText(totalDiffAmount)}</span></div>
    </div>
  ` + list.map((o, idx) => {
    const cardClass = !o.hasInvoice ? 'po-card invoice-missing-card' : (o.isAmountMatched ? 'po-card invoice-ok-card' : 'po-card invoice-missing-card');
    const chipClass = !o.hasInvoice ? 'chip chip-invoice-missing' : (o.isAmountMatched ? 'chip chip-invoice-ok' : 'chip chip-invoice-diff');
    const chipText = !o.hasInvoice ? '未開發票' : (o.isAmountMatched ? `金額一致 ${o.invoiceCount} 筆` : `金額不符 ${o.invoiceCount} 筆`);
    const diffText = o.hasInvoice ? ` ・ 差額 NT$${o.diff.toLocaleString()}` : '';
    const invoiceText = o.hasInvoice
      ? `發票 NT$${o.invoiceAmount.toLocaleString()}${diffText}${o.invoiceNos.length ? ' ・ ' + o.invoiceNos.join('、') : ''}`
      : '尚未在發票檔找到對應 PO';

    return `<div class="${cardClass}">
      <div class="po-header" onclick="toggle('${prefix}d${idx}','${prefix}ch${idx}')">
        <div class="po-title">
          <div class="po-no">${o.po}</div>
          <div class="po-sub">${invoiceText}</div>
        </div>
        <div class="po-right">
          <div class="po-amount">PO NT$${o.poTotal.toLocaleString()}</div>
          <div class="po-amount-sub">${o.items.length} 項</div>
        </div>
        <span class="${chipClass}">${chipText}</span>
        <i class="ti ti-chevron-down chevron" id="${prefix}ch${idx}" aria-hidden="true"></i>
      </div>
      <div class="detail" id="${prefix}d${idx}">
        <div class="detail-inner">
          <div class="dtitle">PO 品項與發票匹配</div>
          <table class="dtbl">
            <colgroup>
              <col style="width:30%"><col style="width:10%"><col style="width:12%"><col style="width:14%"><col style="width:14%"><col style="width:20%">
            </colgroup>
            <thead><tr>
              <th>品名</th><th class="num">數量</th><th class="num">單價</th><th class="num">PO金額</th><th class="num">發票金額</th><th style="text-align:center;">狀態</th>
            </tr></thead>
            <tbody>
              ${o.items.map(item => `<tr>
                <td>${item.name || '—'}</td>
                <td class="num">${item.qty || '—'}</td>
                <td class="num">${item.unitPrice > 0 ? item.unitPrice.toLocaleString() : '—'}</td>
                <td class="num">${item.total > 0 ? 'NT$' + item.total.toLocaleString() : '—'}</td>
                <td class="num ${!o.hasInvoice ? 'c-red' : (o.isAmountMatched ? 'c-green' : 'c-warn')}">${o.hasInvoice ? 'NT$' + o.invoiceAmount.toLocaleString() : '未開立'}</td>
                <td style="text-align:center;"><span class="${chipClass}">${chipText}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
          <div class="summary-row">
            <div class="sr-item"><span class="sr-label">PO 金額</span><span class="sr-value">NT$${o.poTotal.toLocaleString()}</span></div>
            <div class="sr-item"><span class="sr-label">發票金額</span><span class="sr-value ${!o.hasInvoice ? 'c-red' : (o.isAmountMatched ? 'c-green' : 'c-warn')}">${o.hasInvoice ? 'NT$' + o.invoiceAmount.toLocaleString() : '未開立'}</span></div>
            <div class="sr-item"><span class="sr-label">差額</span><span class="sr-value ${o.diff === 0 ? 'c-green' : (o.hasInvoice ? 'c-warn' : 'c-red')}">NT$${o.diff.toLocaleString()}</span></div>
            ${o.hasInvoice ? `<div class="sr-item"><span class="sr-label">發票筆數</span><span class="sr-value">${o.invoiceCount}</span></div>` : `<div class="sr-item"><span class="sr-label">狀態</span><span class="sr-value" style="color:#D85A30;">未開發票</span></div>`}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}


function toggle(detailId, chevronId) {
  document.getElementById(detailId)?.classList.toggle('open');
  document.getElementById(chevronId)?.classList.toggle('open');
}
 
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['urgent','main-pending','main-done','wh-pending','wh-done','missing-po','invoice-match'].forEach(id => {
    document.getElementById('tab-' + id).style.display = tab === id ? 'block' : 'none';
  });
  updateSummaryForTab(tab);
}
